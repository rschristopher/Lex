[project]
name = "lex"
version = "0.1.0"
description = "A generic RPG engine and tablet character app."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
lex = "lex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lex"]

[tool.hatch.build.targets.wheel.force-include]
"lex/index.html" = "lex/index.html"
"lex/static" = "lex/static"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
